<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Witaj w Django</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #007bff, #6610f2);
            color: white;
            text-align: center;
            padding-top: 100px;
        }
        h1 {
            font-size: 3em;
        }
        p {
            font-size: 1.2em;
        }
        .button {
            background-color: white;
            color: #007bff;
            border: none;
            padding: 10px 20px;
            margin-top: 20px;
            font-size: 1em;
            border-radius: 10px;
            cursor: pointer;
        }
        .button:hover {
            background-color: #e9ecef;
        }
    </style>
</head>
<body>
    <h1>🚀 Witaj w Twojej aplikacji Django!</h1>
    <p>To Twój pierwszy szablon HTML 🎨</p>
    <button class="button" onclick="alert('Działa! 😎')">Kliknij mnie</button>
</body>
</html>
